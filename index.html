<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDLive — Markdown Editor</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">M↓</span>
      <div>
        <h1>MDLive</h1>
        <p>Markdown editor with live preview</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="tbtn" id="downloadBtn">Download .md</button>
      <button class="tbtn primary" id="copyHtmlBtn">Copy HTML</button>
    </div>
  </header>

  <div class="toolbar">
    <button class="tool" data-syntax="bold" title="Bold">B</button>
    <button class="tool ital" data-syntax="italic" title="Italic">I</button>
    <button class="tool" data-syntax="strike" title="Strikethrough">S</button>
    <span class="sep"></span>
    <button class="tool" data-syntax="h1" title="Heading 1">H1</button>
    <button class="tool" data-syntax="h2" title="Heading 2">H2</button>
    <button class="tool" data-syntax="h3" title="Heading 3">H3</button>
    <span class="sep"></span>
    <button class="tool" data-syntax="link" title="Link">🔗</button>
    <button class="tool" data-syntax="image" title="Image">🖼️</button>
    <button class="tool" data-syntax="code" title="Inline code">&lt;/&gt;</button>
    <button class="tool" data-syntax="codeblock" title="Code block">{ }</button>
    <span class="sep"></span>
    <button class="tool" data-syntax="ul" title="Bullet list">• List</button>
    <button class="tool" data-syntax="ol" title="Numbered list">1. List</button>
    <button class="tool" data-syntax="quote" title="Quote">❝</button>
    <button class="tool" data-syntax="hr" title="Divider">―</button>
    <span class="spacer"></span>
    <button class="tool clear" id="clearBtn" title="Clear">Clear</button>
  </div>

  <div class="workspace">
    <section class="pane editor-pane">
      <div class="pane-head">
        <span>Editor</span>
        <span class="stat" id="editorStat">0 words · 0 chars</span>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="# Start writing markdown…"></textarea>
    </section>

    <section class="pane preview-pane">
      <div class="pane-head">
        <span>Preview</span>
        <span class="stat" id="scrollStat">synced</span>
      </div>
      <article class="preview" id="preview"></article>
    </section>
  </div>

  <footer class="statusbar">
    <span id="statusMsg">Ready</span>
    <span class="cheat">
      <code>#</code> heading · <code>**bold**</code> · <code>*italic*</code> ·
      <code>`code`</code> · <code>[link](url)</code> · <code>- list</code> · <code>&gt; quote</code>
    </span>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
